name: Sincronizar con el repo original

on:
  schedule:
    - cron: "*/15 * * * *"   # cada hora, al minuto 17
  workflow_dispatch:        # permite correrlo a mano

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Traer cambios del repo original
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/merge-upstream -f branch=main
