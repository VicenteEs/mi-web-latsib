name: Sincronizar con el repo original

on:
  schedule:
    - cron: "2-59/5 * * * *"   # Cada 5 minutos, fuera del inicio de la hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Traer cambios del repo original
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/merge-upstream -f branch=main
